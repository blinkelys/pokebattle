services:
  backend:
    build:
      context: .
      target: development
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      SERVER_PORT: "5000"
      HOST: "0.0.0.0"
      FLASK_DEBUG: "1"
    volumes:
      - ./Pokemon.py:/app/Pokemon.py
      - ./server.py:/app/server.py

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      FRONTEND_PORT: "5173"
      VITE_PROXY_TARGET: http://backend:5000
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
