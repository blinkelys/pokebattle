services:
  backend:
    build:
      context: .
      target: production
    expose:
      - "5000"
    environment:
      SERVER_PORT: "5000"
      HOST: "0.0.0.0"
      FLASK_DEBUG: "0"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
